name: Update tournaments

on:
  schedule:
    - cron: "0 5 * * 1"      # Monday 6pm NZDT (use "0 6 * * 1" in winter)
  workflow_dispatch:         # adds the "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python update_tournaments.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add tournaments.json
          git diff --cached --quiet || (git commit -m "Update tournaments from TTNZ calendar" && git push)
